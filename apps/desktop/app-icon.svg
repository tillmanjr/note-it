<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- App logo / icon source: a bold "N" on a tile with its top-right corner folded like a note page.
       Colors match the light theme's New note button (accent #2370b8 with its top-lit gradient).
       The app bar draws the same shapes with the live theme accent (src/components/Logo.tsx).
       Regenerate the platform icons with: npx tauri icon app-icon.svg (in apps/desktop). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d81c1"/>
      <stop offset="1" stop-color="#2370b8"/>
    </linearGradient>
  </defs>
  <path d="M264 64H720L960 304V760Q960 960 760 960H264Q64 960 64 760V264Q64 64 264 64Z" fill="url(#tile)"/>
  <path d="M720 64V244Q720 304 780 304H960Z" fill="#a9cbec"/>
  <path d="M336 736V320L688 736V320" fill="none" stroke="#fff" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
